name: Materialize verified 0.6.0 authoring source
on:
  push:
    branches: [main]
    paths: ['.delivery/parity-060.*.xzpart', '.delivery/restore-parity-060.py', '.github/workflows/parity-delivery.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: counterform-parity-060-delivery
  cancel-in-progress: false
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Verify and restore the reviewed source delta
        run: python .delivery/restore-parity-060.py
      - run: npm test
      - name: Commit complete editable implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages tests docs README.md CHANGELOG.md package.json
          git diff --cached --quiet || git commit -m 'feat: add positional attachments, variable axis maps and curve-analysis workflows'
          git push origin HEAD:main
          git rev-parse HEAD
