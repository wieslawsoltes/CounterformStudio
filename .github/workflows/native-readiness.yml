name: Commit native-surface readiness regression fix
on:
  push:
    branches: [main]
    paths: ['.delivery/native-readiness.patch', '.github/workflows/native-readiness.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: counterform-native-readiness
  cancel-in-progress: false
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Apply the exact reviewed readiness changes
        run: |
          python - <<'PY'
          import hashlib,pathlib,subprocess
          changes={
            'tests/browser.py':('f7190761f9ea5107df7de2678fe1a11fbaea0c6f','7f96b3dc417342e5a888929d094d1744c3323ae9'),
            'tests/workspace-browser.py':('6a2ec1ba899da3b419f126f348ea86ca6c675588','76d278d9ea09151e196578f240ea6a606d7c336d'),
            'tests/live-pages.py':('ca13a94c17c7bb003f7de28e6d9421547f09b459','291d0340dd085801c6e3a008e92358587c6c6794')}
          def blob(name):
            data=pathlib.Path(name).read_bytes()
            return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          patch=pathlib.Path('.delivery/native-readiness.patch').read_bytes()
          assert hashlib.sha256(patch).hexdigest()=='33556e44df66e7bdab1b5553448d030c3bf51a97f55baa283fc9a134b794d11e'
          if not all(blob(name)==after for name,(before,after) in changes.items()):
            assert all(blob(name)==before for name,(before,after) in changes.items()),'Source diverged'
            subprocess.run(['git','apply','--check'],input=patch,check=True)
            subprocess.run(['git','apply'],input=patch,check=True)
          assert all(blob(name)==after for name,(before,after) in changes.items())
          PY
      - run: npm test
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests -p 'test_browser_ready.py' -v
      - run: python tests/workspace-browser.py --out-dir test-results/workspace-ready
      - name: Commit regression fix and settled native-renderer screenshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for name in desktop-workspace font-window desktop-dark; do
            cp "test-results/workspace-ready/$name.png" "docs/images/$name.png"
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/browser.py tests/workspace-browser.py tests/live-pages.py docs/images
          git diff --cached --quiet || git commit -m 'test: await native Skia paint independently of compiler proof readiness'
          git push origin HEAD:main
          gh workflow run ci.yml --ref main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: counterform-native-readiness
          path: test-results/workspace-ready
