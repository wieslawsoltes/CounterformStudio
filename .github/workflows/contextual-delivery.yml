name: Commit verified contextual layout compiler
on:
  push:
    branches: [main]
    paths: ['.delivery/contextual.*.xzpart', '.delivery/restore-contextual.py', '.github/workflows/contextual-delivery.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: counterform-contextual-delivery
  cancel-in-progress: false
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: python .delivery/restore-contextual.py
      - run: npm test
      - name: Commit source and dispatch full verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages tests docs package.json
          git diff --cached --quiet || git commit -m 'feat: compile contextual OpenType lookups with script-language selection'
          git push origin HEAD:main
          gh workflow run ci.yml --ref main
