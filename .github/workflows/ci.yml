name: Verify and publish Counterform Studio
on:
  push:
    branches: [main]
    paths-ignore: ['.delivery/**', '.recovery/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: counterform-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Archive exact source before verification
        run: git archive --format=tar.gz HEAD -o CounterformStudio-source.tar.gz
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: npm test
      - run: python -m pip install -r tests/requirements.txt
      - run: npx --yes --package=typescript@5.9.3 tsc -p tests/tsconfig.json
      - run: npm run test:fonts
      - run: npm run build
      - run: npm run pack:all && npm run test:packages
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: counterform-verification
          path: |
            test-results
            artifacts/npm
            CounterformStudio-source.tar.gz
      - name: Share the exact built distribution with all browser gates
        uses: actions/upload-artifact@v4
        with:
          name: counterform-runtime
          path: dist
          include-hidden-files: true
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with: {path: dist}
  browser:
    name: Browser / ${{ matrix.suite }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {suite: bitmap, script: bitmap-browser.py}
          - {suite: artwork, script: artwork-browser.py}
          - {suite: interchange, script: interchange-browser.py}
          - {suite: workflows, script: workflows-browser.py}
          - {suite: advanced, script: advanced-browser.py}
          - {suite: input, script: workspace-input.py}
          - {suite: editor, script: browser.py}
          - {suite: workspace, script: workspace-browser.py}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: npm run bootstrap
      - uses: actions/download-artifact@v4
        with:
          name: counterform-runtime
          path: dist
      - run: python -m pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - name: Independent native-renderer readiness regressions
        if: matrix.suite == 'workspace'
        run: python -m unittest discover -s tests -p 'test_browser_ready.py' -v
      - name: Source browser gate with real workers and secure storage
        run: python tests/${{ matrix.script }} --out-dir test-results/${{ matrix.suite }}-source
      - name: Exact built-distribution browser gate
        run: python tests/${{ matrix.script }} --root dist --out-dir test-results/${{ matrix.suite }}-distribution
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: counterform-browser-${{ matrix.suite }}
          path: |
            test-results/${{ matrix.suite }}-source
            test-results/${{ matrix.suite }}-distribution
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [verify, browser]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
  live-pages:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: python -m pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - name: Qualify exact deployed build, workers, icons and storage
        run: python tests/live-pages.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: counterform-live-pages
          path: test-results/live-pages
