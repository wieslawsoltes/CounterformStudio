name: Verify and publish Counterform Studio
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: counterform-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: npm test
      - run: python -m pip install fonttools==4.63.0 brotli playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: npx --yes --package=typescript@5.9.3 tsc -p tests/tsconfig.json
      - run: npm run test:fonts
      - run: npm run build
      - run: npm run pack:all && npm run test:packages
      - name: Browser source and distribution verification
        run: |
          python tests/browser.py
          mkdir -p test-results/source
          cp test-results/*.png test-results/source/ || true
          python tests/browser.py --root dist
      - name: Archive checkout without generated fonts or external tooling
        run: git archive --format=tar.gz HEAD -o CounterformStudio-source.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: counterform-verification
          path: |
            test-results
            artifacts/npm
            CounterformStudio-source.tar.gz
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with: {path: dist}
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
