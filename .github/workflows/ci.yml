name: Verify and publish Counterform Studio
on:
  push:
    branches: [main]
    paths-ignore: ['.delivery/**', '.recovery/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: counterform-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Archive exact source before verification
        run: git archive --format=tar.gz HEAD -o CounterformStudio-source.tar.gz
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: npm test
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests -p 'test_browser_ready.py' -v
      - run: npx --yes --package=typescript@5.9.3 tsc -p tests/tsconfig.json
      - run: npm run test:fonts
      - run: npm run build
      - run: npm run pack:all && npm run test:packages
      - name: Artwork references, tracing and curve-fitting workflows
        run: |
          python tests/artwork-browser.py --out-dir test-results/artwork-source
          python tests/artwork-browser.py --root dist --out-dir test-results/artwork-distribution
      - name: Unicode, SVG and modal ownership workflows
        run: |
          python tests/interchange-browser.py --out-dir test-results/interchange-source
          python tests/interchange-browser.py --root dist --out-dir test-results/interchange-distribution
      - name: Conditional layout, collection and metrics workflows
        run: |
          python tests/workflows-browser.py --out-dir test-results/workflows-source
          python tests/workflows-browser.py --root dist --out-dir test-results/workflows-distribution
      - name: Attachment, axis-map and outline-analysis workflows
        run: |
          python tests/advanced-browser.py --out-dir test-results/advanced-source
          python tests/advanced-browser.py --root dist --out-dir test-results/advanced-distribution
      - name: Workspace input and lifetime regressions
        run: |
          python tests/workspace-input.py --out-dir test-results/input-source
          python tests/workspace-input.py --root dist --out-dir test-results/input-distribution
      - name: Browser source and distribution verification
        run: |
          python tests/browser.py --out-dir test-results/source
          python tests/browser.py --root dist --out-dir test-results/distribution
          python tests/workspace-browser.py --out-dir test-results/workspace-source
          python tests/workspace-browser.py --root dist --out-dir test-results/workspace-distribution
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: counterform-verification
          path: |
            test-results
            artifacts/npm
            CounterformStudio-source.tar.gz
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with: {path: dist}
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
  live-pages:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: python -m pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - name: Qualify exact deployed build, workers, icons and storage
        run: python tests/live-pages.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: counterform-live-pages
          path: test-results/live-pages
