name: Commit verified bitmap color authoring
on:
  push:
    branches: [main]
    paths: ['.delivery/bitmap.*.xzpart', '.delivery/restore-bitmap.py', '.github/workflows/bitmap-delivery.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: counterform-bitmap-delivery
  cancel-in-progress: false
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Restore verified bitmap codec, editor and import source
        run: python .delivery/restore-bitmap.py
      - run: npm test
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python tests/bitmap-fonttools.py
      - name: Qualify actual browser workers, bitmap pixels and outline preservation
        run: python tests/bitmap-browser.py --out-dir test-results/bitmap-delivery
      - name: Commit complete readable implementation and actual application screenshot
        run: |
          mkdir -p docs/images
          cp test-results/bitmap-delivery/bitmap-strikes.png docs/images/bitmap-strikes.png
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages tests docs README.md CHANGELOG.md package.json
          git diff --cached --quiet || git commit -m 'feat: release 0.10.0 PNG bitmap color strikes and safe outline import'
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: counterform-bitmap-delivery
          path: test-results/bitmap-delivery
