name: Commit verified 0.7.0 production workflows
on:
  push:
    branches: [main]
    paths: ['.delivery/workflows.*.xzpart', '.delivery/restore-workflows.py', '.github/workflows/workflows-delivery.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: counterform-workflows-delivery
  cancel-in-progress: false
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Verify and restore every source record
        run: python .delivery/restore-workflows.py
      - run: npm test
      - name: Commit all editable implementation, tests and documentation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages tests docs README.md CHANGELOG.md package.json
          git diff --cached --quiet || git commit -m 'feat: add conditional layout, font collections and transactional metrics workflows'
          git push origin HEAD:main
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: npx --yes --package=typescript@5.9.3 tsc -p tests/tsconfig.json
      - run: npm run test:fonts
      - run: python tests/workflows-browser.py --out-dir test-results/workflows-delivery
      - name: Commit fresh workflow screenshots and dispatch all regression gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p docs/images
          for name in metrics-editor collection-builder conditional-features; do
            cp "test-results/workflows-delivery/$name.png" "docs/images/$name.png"
          done
          git add docs/images
          git diff --cached --quiet || git commit -m 'docs: capture verified metrics, collection and conditional-feature editors'
          git push origin HEAD:main
          gh workflow run ci.yml --ref main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: counterform-workflows-delivery
          path: test-results
