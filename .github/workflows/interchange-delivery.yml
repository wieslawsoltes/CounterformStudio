name: Commit verified Unicode and SVG interchange
on:
  push:
    branches: [main]
    paths: ['.delivery/interchange.*.xzpart', '.delivery/restore-interchange.py', '.github/workflows/interchange-delivery.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: counterform-interchange-delivery
  cancel-in-progress: false
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: python .delivery/restore-interchange.py
      - run: npm test
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Verify actual browser workers, Unicode proof and SVG workflows
        run: python tests/interchange-browser.py --out-dir test-results/interchange-delivery
      - name: Commit complete editable implementation and tested screenshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p docs/images
          for name in unicode-variation-editor svg-outline-import; do
            cp "test-results/interchange-delivery/$name.png" "docs/images/$name.png"
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages tests docs README.md CHANGELOG.md package.json
          git diff --cached --quiet || git commit -m 'feat: release 0.8.0 Unicode variation sequences and SVG outline interchange'
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: counterform-interchange-delivery
          path: test-results/interchange-delivery
