name: Recover previously uploaded authoring work
on:
  push:
    paths: ['.recovery/**', '.github/workflows/recover.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: pip install zstandard
      - name: Decode recoverable records without changing application source
        run: |
          mkdir -p recovery-output
          python - <<'PY'
          import pathlib, zstandard, json
          raw=b''.join(p.read_bytes() for p in sorted(pathlib.Path('.recovery').glob('round3.*.zstpart')))
          obj=zstandard.ZstdDecompressor().decompressobj()
          data=obj.decompress(raw)
          out=pathlib.Path('recovery-output')
          (out/'partial.json').write_bytes(data)
          (out/'report.json').write_text(json.dumps({'compressedBytes':len(raw),'decodedBytes':len(data),'completeFrame':obj.eof}))
          print(len(raw),len(data),obj.eof)
          print(data[:400])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: recovered-authoring-source
          path: recovery-output
          retention-days: 30
