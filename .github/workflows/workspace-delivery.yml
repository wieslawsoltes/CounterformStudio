name: Materialize verified desktop workspace
on:
  push:
    branches: [main]
    paths: ['.delivery/workspace.*.xzpart', '.delivery/restore-workspace.py', '.github/workflows/workspace-delivery.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: counterform-workspace-delivery
  cancel-in-progress: false
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Verify and restore exact desktop workspace source
        run: python .delivery/restore-workspace.py
      - run: npm test
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Exercise desktop workspace interactions in Chromium
        run: python tests/workspace-browser.py --out-dir test-results/workspace-delivery
      - name: Commit complete editable source and fresh screenshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p docs/images
          for name in desktop-workspace font-window desktop-dark; do
            cp "test-results/workspace-delivery/$name.png" "docs/images/$name.png"
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages tests docs README.md CHANGELOG.md package.json
          git diff --cached --quiet || git commit -m 'feat: redesign desktop font workspace with compact chrome and native-style palettes'
          git push origin HEAD:main
          gh workflow run ci.yml --ref main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: counterform-workspace-delivery
          path: test-results/workspace-delivery
