name: Materialize verified 0.3.0 authoring tools and publish
on:
  push:
    branches: [main]
    paths: ['.delivery/**', '.github/workflows/delivery.yml']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: counterform-delivery
  cancel-in-progress: false
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Verify delivery and commit editable source
        run: |
          python - <<'PY'
          import pathlib, hashlib, lzma, subprocess, json
          root=pathlib.Path('.')
          payload=b''.join(p.read_bytes() for p in sorted((root/'.delivery').glob('v3.*.xzpart')))
          assert hashlib.sha256(payload).hexdigest()=='b1f713a19f34ebfa709d2b4661b42ca101d0188859789870017af9706682414d','Corrupted delivery'
          patch=lzma.decompress(payload,memlimit=256*1024*1024)
          version=json.loads((root/'package.json').read_text())['version']
          if version=='0.2.0':
              subprocess.run(['git','apply','--check','--exclude=.github/workflows/ci.yml'],input=patch,check=True)
              subprocess.run(['git','apply','--exclude=.github/workflows/ci.yml'],input=patch,check=True)
          elif version!='0.3.0':
              raise RuntimeError('Unexpected source version: '+version)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app packages scripts tests docs .gitignore package.json README.md CHANGELOG.md
          git diff --cached --quiet || git commit -m 'feat: add 24 authoring tools, accessible menus and vector ribbon icons'
          git push origin HEAD:main
      - run: npm test
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: npx --yes --package=typescript@5.9.3 tsc -p tests/tsconfig.json
      - run: npm run test:fonts && npm run build && npm run pack:all && npm run test:packages
      - name: Browser source and distribution verification
        run: |
          python tests/browser.py --out-dir test-results/source
          python tests/browser.py --root dist --out-dir test-results/distribution
      - name: Commit verified application screenshots
        run: |
          mkdir -p docs/images
          for name in outline-editor color-glyph color-editor authoring-workspace glyph-context-menu tool-reference; do
            cp "test-results/distribution/$name.png" "docs/images/$name.png"
          done
          git add docs/images
          git diff --cached --quiet || git commit -m 'docs: capture verified authoring workspace and tool reference'
          git push origin HEAD:main
      - run: git archive --format=tar.gz HEAD -o CounterformStudio-source.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: counterform-v3-verification
          path: |
            CounterformStudio-source.tar.gz
            test-results
            artifacts/npm
      - uses: actions/upload-pages-artifact@v3
        with: {path: dist}
  deploy:
    needs: materialize
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
