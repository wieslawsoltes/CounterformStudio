name: Commit verified artwork and tracing engines
on:
  push:
    branches: [main]
    paths: ['.delivery/artwork.*.xzpart', '.delivery/restore-artwork.py', '.github/workflows/artwork-delivery.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: counterform-artwork-delivery
  cancel-in-progress: false
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Restore and verify complete editable source
        run: python .delivery/restore-artwork.py
      - run: npm test
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Exercise native artwork, actual tracing workers and transactional editing
        run: python tests/artwork-browser.py --out-dir test-results/artwork-delivery
      - name: Commit implementation and freshly tested screenshots
        run: |
          mkdir -p docs/images
          for name in artwork-reference autotrace-preview; do
            cp "test-results/artwork-delivery/$name.png" "docs/images/$name.png"
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages tests docs README.md CHANGELOG.md package.json
          git diff --cached --quiet || git commit -m 'feat: release 0.9.0 artwork references, vector masks and worker autotracing'
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: counterform-artwork-delivery
          path: test-results/artwork-delivery
